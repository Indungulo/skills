# Lint rules for the helper scripts under skills/*/scripts, kept in line with the
# EUMETSAT Python Class D quality profile: 120-character lines, a docstring on
# every function, naming conventions, and a complexity limit below Sonar's 20.
# The scripts catch broad exceptions and import optional libraries inside
# functions on purpose, so those rules are not selected here.
line-length = 120

[lint]
select = ["E", "F", "W", "C90", "N", "D1"]

[lint.mccabe]
max-complexity = 15
